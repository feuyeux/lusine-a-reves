[project]
name = "lusine-a-reves-meta-builder"
version = "0.2.0"
description = "Deterministic TTS planning and cross-platform orchestration for the Lusine a Reves presentation builder"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
lusine-meta = "lusine_builder.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/lusine_builder"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-q"
